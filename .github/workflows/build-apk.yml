name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo layout
        run: |
          echo "PWD=$(pwd)"
          echo "=== top ==="
          ls -la
          echo "=== find gradle/android ==="
          find . -maxdepth 4 \( -name gradlew -o -name settings.gradle.kts -o -type d -name android \) 2>/dev/null | head -50

      - name: Locate Android project
        id: proj
        run: |
          set -e
          # Case A: android/ at repo root
          if [ -f android/gradlew ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
            echo "Found android/ at repo root"
            exit 0
          fi
          # Case B: nested download-auto-checker/android
          if [ -f download-auto-checker/android/gradlew ]; then
            echo "dir=download-auto-checker/android" >> "$GITHUB_OUTPUT"
            echo "Found nested download-auto-checker/android"
            exit 0
          fi
          # Case C: any gradlew under repo
          G=$(find . -name gradlew -type f | head -1 || true)
          if [ -n "$G" ]; then
            D=$(dirname "$G")
            echo "dir=$D" >> "$GITHUB_OUTPUT"
            echo "Found gradlew at $D"
            exit 0
          fi
          echo "::error::android project not found. Upload the android/ folder to the repo root."
          ls -laR | head -200
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          set -e
          DIR="${{ steps.proj.outputs.dir }}"
          echo "Building in $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        run: |
          set -e
          APK=$(find . -path "*/outputs/apk/debug/*.apk" | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::error::APK not produced. Listing build dirs:"
            find . -type d -name outputs 2>/dev/null | head
            find . -name "*.apk" 2>/dev/null | head
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Found $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: download-checker-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
